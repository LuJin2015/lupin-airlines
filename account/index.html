<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Lupin Airlines</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f5f0;color:#111318}.topbar{padding:18px 6vw;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:20px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;text-decoration:none;color:#111318}.topbar a{color:#111318;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:60px 6vw}.hero{margin-bottom:28px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:#69707d}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;margin:8px 0}.hero h1 span{color:#69707d}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:25px;margin-bottom:20px;box-shadow:0 8px 30px rgba(0,0,0,.04)}label{display:block;font-weight:800;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #bbb;border-radius:10px;font:inherit}button{font:inherit;padding:12px 16px;border:0;border-radius:10px;background:#111318;color:#fff;font-weight:900;cursor:pointer}button.secondary{background:#e8e7e1;color:#111318}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button.active{background:#111318}.tabs button:not(.active){background:#e8e7e1;color:#111318}.hidden{display:none}.status{margin:14px 0;font-weight:700}.booking{border:1px solid #ddd;border-radius:14px;padding:17px;margin:12px 0}.booking h3{margin:0 0 7px}.muted{color:#69707d}.cancel{margin-top:12px;background:#8b1e1e}.success{padding:12px;border-radius:10px;background:#edf6ed}.empty{text-align:center;padding:30px;color:#69707d}footer{padding:30px 6vw;color:#69707d;text-align:center}</style></head><body><header class="topbar"><a class="brand" href="../home/">LUPIN AIRLINES</a><a href="../flights/">Flights</a><a href="../booking/">Book</a><a href="../miles/">Lupin Miles</a></header><main class="wrap"><section class="hero"><p class="eyebrow">LUPIN AIRLINES · ACCOUNT</p><h1>Your <span>account.</span></h1><p>Sign in to book flights and manage your bookings.</p></section><section id="authCard" class="card"><div class="tabs"><button id="loginTab" class="active" type="button">Log in</button><button id="registerTab" type="button">Create account</button></div><form id="authForm"><label>Username<input id="username" maxlength="20" autocomplete="username" required></label><label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button id="authButton" type="submit">Log in</button></form><div id="authStatus" class="status"></div></section><section id="accountCard" class="card hidden"><h2>Welcome, <span id="accountName"></span> ✈️</h2><p class="muted">Your bookings are tied to this account.</p><button id="refresh" type="button">Refresh bookings</button> <button id="logout" class="secondary" type="button">Log out</button><div id="bookingsStatus" class="status"></div><div id="bookings"></div></section></main><footer>Lupin Airlines · Fan-made parody project.</footer><script src="script.js"></script></body></html>
