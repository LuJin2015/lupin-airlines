<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings — Lupin Airlines</title><style>body{margin:0;font-family:system-ui;background:#f6f5f0;color:#111318}.topbar{padding:18px 6vw;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:20px;align-items:center}.brand{font-weight:900;text-decoration:none}.wrap{padding:60px 6vw}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:25px;overflow:auto}input,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #bbb}button{background:#111318;color:#fff;font-weight:800;cursor:pointer}.hint{color:#69707d}.status{margin:18px 0}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #e5e5df}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.empty{padding:35px;text-align:center;color:#69707d}</style></head><body><header class="topbar"><a class="brand" href="../home/">LUPIN AIRLINES</a><a href="../flights/">Flights</a><a href="../booking/">Book</a></header><main class="wrap"><h1>Booking <span>dashboard.</span></h1><p class="hint">Private admin view · bookings are stored in the connected Google Sheet.</p><div class="card"><label>Admin key <input id="key" type="password" autocomplete="off" placeholder="Enter your admin key"></label> <button id="load">Load bookings</button><div id="status" class="status"></div><div id="table"></div></div></main><script>const url='../booking/script.js';document.getElementById('load').addEventListener('click',async()=>{const key=document.getElementById('key').value.trim(),status=document.getElementById('status'),table=document.getElementById('table');status.textContent='Loading…';table.innerHTML='';if(!key){status.textContent='Enter the admin key.';return}const endpoint=prompt('Paste your Google Apps Script web-app URL');if(!endpoint){status.textContent='No web-app URL supplied.';return}try{const r=await fetch(endpoint+'?key='+encodeURIComponent(key));const d=await r.json();if(!d.ok)throw new Error(d.error||'Could not load bookings.');status.textContent=d.bookings.length+' booking(s) found.';if(!d.bookings.length){table.innerHTML='<div class="empty">No bookings yet.</div>';return}const headers=['Booking ID','Booked At','Passenger','Flight','Destination','Date','Time','Gate','Passengers','Fare'];table.innerHTML='<table class="table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+d.bookings.map(row=>'<tr>'+row.map((cell,i)=>'<td>'+(i===9?'S$'+Number(cell||0).toLocaleString():String(cell).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}catch(e){status.textContent='❌ '+e.message}});</script></body></html>
