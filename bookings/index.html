<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings — Lupin Airlines</title><style>body{margin:0;font-family:system-ui;background:#f6f5f0;color:#111318}.topbar{padding:18px 6vw;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:20px;align-items:center}.brand{font-weight:900;text-decoration:none;color:#111318}.wrap{padding:60px 6vw}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:25px;overflow:auto}button{font:inherit;padding:12px 14px;border:0;border-radius:10px;background:#111318;color:#fff;font-weight:800;cursor:pointer}.hint{color:#69707d}.status{margin:18px 0}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #e5e5df}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.empty{padding:35px;text-align:center;color:#69707d}</style></head><body><header class="topbar"><a class="brand" href="../home/">LUPIN AIRLINES</a><a href="../flights/">Flights</a><a href="../booking/">Book</a><a href="../account/">Account</a></header><main class="wrap"><h1>My <span>bookings.</span></h1><p class="hint">Your bookings are loaded from the shared Lupin cloud account.</p><div class="card"><button id="load" type="button">Load bookings</button><div id="status" class="status"></div><div id="table"></div></div></main><script src="../site-config.js?v=20261008-1"></script><script src="../cloud-auth.js?v=20261008-1"></script><script src="../site.js?v=20261008-6"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=[['Booking ID','bookingId'],['Booked At','bookedAt'],['Passenger','name'],['Flight','flight'],['Destination','destination'],['Date','date'],['Time','time'],['Gate','gate'],['Passengers','passengers'],['Fare','fare'],['Status','status']];
async function loadBookings(){const status=document.getElementById('status'),table=document.getElementById('table');status.textContent='Loading…';table.innerHTML='';try{const c=window.LUPIN_CLOUD;if(!c)throw new Error('Cloud client unavailable.');const a=await c.account();if(!a){status.innerHTML='🔐 <a href="../account/">Log in to view your bookings.</a>';return}const rows=await c.bookings();status.textContent=rows.length+' booking(s) found.';if(!rows.length){table.innerHTML='<div class="empty">No bookings yet. <a href="../booking/">Book a flight →</a></div>';return}table.innerHTML='<table class="table"><thead><tr>'+fields.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+fields.map(x=>'<td>'+esc(x[1]==='fare'?'S$'+Number(r.fare||0).toLocaleString():r[x[1]]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}catch(e){status.textContent='❌ '+e.message}}
document.getElementById('load').addEventListener('click',loadBookings);document.addEventListener('DOMContentLoaded',loadBookings);
</script></body></html>
